name: Web3Edu Frontend CI

on:
  push:
  pull_request:

jobs:
  frontend-build-and-tests:
    name: Frontend Build and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency invariants
        run: npm run check:deps

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Targeted production audit
        run: npm run check:audit

      - name: Upload production audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-prod
          path: security-reports/npm-audit-prod.json
          if-no-files-found: warn
